name: Build Custom Robo 3DSX

on:
  workflow_dispatch: # Memicu tombol build manual di tab Actions

jobs:
  build-3ds:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest # Menggunakan server Docker yang sudah berisi devkitARM otomatis

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install 3DS Build Dependencies
      run: |
        # Memasang library grafis dan sistem dasar untuk Nintendo 3DS
        dkp-pacman -Syu --noconfirm
        dkp-pacman -S --needed --noconfirm 3ds-dev 3ds-libctru 3ds-citro3d 3ds-citro2d

    - name: Compile to 3DSX
      run: |
        # Memulai proses rakit file .3dsx langsung di server
        make -f Makefile.3ds
      continue-on-error: true

    - name: Upload Finished 3DSX (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: Custom-Robo-3DSX-Build
        path: |
          *.3dsx
          *.smdh
          
