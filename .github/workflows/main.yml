name: Build Custom Robo 3DSX

on:
  workflow_dispatch:

jobs:
  build-3ds:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Download ISO and Extract Game Data
      run: |
        # Buat folder ekstraksi sesuai instruksi README
        mkdir -p data/extracted
        
        # Mengunduh file ISO langsung ke server GitHub (GANTI LINK DI BAWAH DENGAN LINK ISO ANDA)
        curl -L "MASUKKAN_LINK_DIRECT_DOWNLOAD_ISO_DI_SINI" -o game.iso
        
        # Jalankan skrip dekompilasi menggunakan Python bawaan sistem kontainer
        python3 tools/recomp/recomp.py game.iso

    - name: Compile to 3DSX
      run: |
        export DEVKITPRO=/opt/devkitpro
        export DEVKITARM=$DEVKITPRO/devkitARM
        export PATH=$DEVKITPRO/tools/bin:$DEVKITARM/bin:$PATH
        
        # Jalankan kompilasi menggunakan Makefile asli di folder tools/hw
        cd tools/hw
        make
      shell: bash

    - name: Upload Finished 3DSX (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: Custom-Robo-3DSX-Build
        path: |
          tools/hw/*.3dsx
          tools/hw/*.smdh
          
