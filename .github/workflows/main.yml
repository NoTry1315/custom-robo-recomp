name: Build Custom Robo 3DSX

on:
  workflow_dispatch:

jobs:
  build-3ds:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install 3DS Build Dependencies
      run: |
        # Memasang paket utama 3ds-dev yang sudah mencakup libctru, citro3d, dan citro2d secara otomatis
        dkp-pacman -Syu --noconfirm
        dkp-pacman -S --needed --noconfirm 3ds-dev

    - name: Compile to 3DSX
      run: |
        make -f Makefile.3ds
      continue-on-error: true

    - name: Upload Finished 3DSX (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: Custom-Robo-3DSX-Build
        path: |
          *.3dsx
          *.smdh
          
