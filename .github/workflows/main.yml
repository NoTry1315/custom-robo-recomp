name: Build Custom Robo 3DSX

on:
  workflow_dispatch:

jobs:
  build-3ds:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Compile to 3DSX
      run: |
        # Masuk ke folder tempat Makefile berada lalu jalankan kompilasi
        cd tools/hw
        make

    - name: Upload Finished 3DSX (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: Custom-Robo-3DSX-Build
        path: |
          tools/hw/*.3dsx
          tools/hw/*.smdh
          
